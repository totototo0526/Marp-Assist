<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Marp 原稿ジェネレーター</title>
    <script src="https://cdn.jsdelivr.net/npm/@marp-team/marpit/dist/marpit.browser.js"></script>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .main-container {
            display: flex;
            flex-grow: 1;
            overflow: hidden;
        }
        .editor-column, .preview-column {
            flex: 1;
            padding: 1em;
            overflow-y: auto;
            box-sizing: border-box;
        }
        .editor-column {
            display: flex;
            flex-direction: column;
        }
        .preview-column {
            border-left: 1px solid #ccc;
            background-color: #f9f9f9;
        }
        #preview-area {
            width: 100%;
            height: 100%;
        }
        /* Marpit preview requires this for scaling */
        #preview-area svg {
            width: 100%;
            height: auto;
        }
        textarea { width: 100%; box-sizing: border-box; margin-bottom: 1em; }
        #topic-input { height: 100px; }
        button { padding: 0.5em 1em; cursor: pointer; }
        .controls-container { display: flex; gap: 20px; margin-bottom: 1em; align-items: center; flex-wrap: wrap; }
        .result-header { display: flex; align-items: center; justify-content: space-between; }
        #copy-button { font-size: 0.8em; }
        #result-textarea {
            width: 100%;
            flex-grow: 1; /* Take remaining vertical space */
            margin-top: 1em;
            padding: 1em;
            background-color: #f0f0f0;
            border: 1px solid #ccc;
            font-family: monospace;
            box-sizing: border-box;
            resize: vertical;
        }
        .loading { color: #888; }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="editor-column">
            <h1>AI Marp 原稿ジェネレーター (MVP)</h1>
            <p>投稿したいお題やキーワードを入力してください。</p>

            <div class="controls-container">
                <div>
                    <label for="template-select">テンプレート選択:</label>
                    <select id="template-select" name="templates">
                        <!-- Options will be populated by script.js -->
                    </select>
                </div>
                <div>
                    <label for="theme-select">テーマ選択:</label>
                    <select id="theme-select" name="themes">
                        <!-- Options will be populated by script.js -->
                    </select>
                </div>
            </div>

            <div id="marp-options-container" style="display: none; margin-bottom: 1em; display: flex; gap: 20px; align-items: center;">
                <div>
                    <label for="slide-count-input">スライド枚数:</label>
                    <input type="number" id="slide-count-input" value="5" min="1" max="20" style="width: 60px;">
                </div>
                <div>
                    <input type="checkbox" id="include-hashtags-checkbox" checked>
                    <label for="include-hashtags-checkbox">ハッシュタグを含める</label>
                </div>
            </div>

            <textarea id="topic-input" placeholder="例：テレワークの生産性を上げる3つのコツ"></textarea>
            <button id="generate-button">Marp原稿を生成する</button>

            <div class="result-header">
                <h2>生成結果：</h2>
                <div>
                    <button id="copy-button">結果をコピー</button>
                    <button id="download-pdf-button" disabled>PDFでダウンロード</button>
                </div>
            </div>
            <textarea id="result-textarea" class="language-markdown">ここに結果が表示されます...</textarea>
        </div>
        <div id="preview-area" class="preview-column">
            <!-- Preview will be rendered here -->
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
